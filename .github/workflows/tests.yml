name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # sounddevice's Linux wheels don't bundle PortAudio (the macOS and
      # Windows ones do). ffmpeg is for the .mp3 conversion tests, which
      # skip where it isn't installed.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 ffmpeg
      - run: pip install -e ".[test]"
      - run: pytest -v
