[project]
name = "recordit"
version = "0.1.0"
description = "Lightweight background WAV recorder for the system's default input device"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
recordit = "recordit.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
